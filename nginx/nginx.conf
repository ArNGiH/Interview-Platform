events {}

http {

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream oauth2_proxy {
        server oauth2-proxy:4180;
    }

    server {

        listen 80;

        client_max_body_size 50M;

        # =====================================
        # OAUTH2 PROXY ROUTES
        # =====================================

        location /oauth2/ {

            proxy_pass http://oauth2_proxy;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Scheme $scheme;

            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        location = /oauth2/auth {

            internal;

            proxy_pass http://oauth2_proxy;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Scheme $scheme;

            proxy_set_header Content-Length "";

            proxy_pass_request_body off;
        }

        # =====================================
        # SWAGGER / OPENAPI
        # =====================================

        location /docs {

            auth_request /oauth2/auth;

            auth_request_set $user $upstream_http_x_auth_request_user;

            auth_request_set $email $upstream_http_x_auth_request_email;

            auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;

            auth_request_set $picture $upstream_http_x_auth_request_picture;

            error_page 401 = /oauth2/sign_in;

            proxy_pass http://backend/docs;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-User $user;

            proxy_set_header X-Forwarded-Email $email;

            proxy_set_header X-Forwarded-Preferred-Username $preferred_username;

            proxy_set_header X-Forwarded-Picture $picture;
        }

        location /openapi.json {

            auth_request /oauth2/auth;

            auth_request_set $user $upstream_http_x_auth_request_user;

            auth_request_set $email $upstream_http_x_auth_request_email;

            auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;

            auth_request_set $picture $upstream_http_x_auth_request_picture;

            error_page 401 = /oauth2/sign_in;

            proxy_pass http://backend/openapi.json;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-User $user;

            proxy_set_header X-Forwarded-Email $email;

            proxy_set_header X-Forwarded-Preferred-Username $preferred_username;

            proxy_set_header X-Forwarded-Picture $picture;
        }

        # =====================================
        # FRONTEND
        # =====================================

        location / {

            auth_request /oauth2/auth;

            auth_request_set $user $upstream_http_x_auth_request_user;

            auth_request_set $email $upstream_http_x_auth_request_email;

            auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;

            auth_request_set $picture $upstream_http_x_auth_request_picture;

            error_page 401 = /oauth2/sign_in;

            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-User $user;

            proxy_set_header X-Forwarded-Email $email;

            proxy_set_header X-Forwarded-Preferred-Username $preferred_username;

            proxy_set_header X-Forwarded-Picture $picture;
        }

        # =====================================
        # BACKEND API
        # =====================================

        location /api/ {

            auth_request /oauth2/auth;

            auth_request_set $user $upstream_http_x_auth_request_user;

            auth_request_set $email $upstream_http_x_auth_request_email;

            auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;

            auth_request_set $picture $upstream_http_x_auth_request_picture;

            error_page 401 = /oauth2/sign_in;

            proxy_pass http://backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-User $user;

            proxy_set_header X-Forwarded-Email $email;

            proxy_set_header X-Forwarded-Preferred-Username $preferred_username;

            proxy_set_header X-Forwarded-Picture $picture;

            # IMPORTANT FOR STREAMING

            proxy_buffering off;

            proxy_cache off;

            proxy_read_timeout 3600s;

            chunked_transfer_encoding on;

            proxy_set_header Connection '';
        }
    }
}
