services:

  frontend:

    build:
      context: ./Interview-Platform-Frontend
      dockerfile: Dockerfile

    container_name: ai-interview-frontend

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_SERVER_URL: /api

    depends_on:
      - backend

    networks:
      - app-network

  # =========================================

  backend:

    build:
      context: ./Interview-Platform-Backend
      dockerfile: Dockerfile

    container_name: ai-interview-backend

    restart: unless-stopped

    env_file:
      - ./Interview-Platform-Backend/.env

    depends_on:
      - postgres

    networks:
      - app-network

  # =========================================

  postgres:

    image: pgvector/pgvector:pg16

    container_name: ai-interview-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - app-network

  # =========================================

  nginx:

    image: nginx:latest

    container_name: ai-interview-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend
      - oauth2-proxy

    networks:
      - app-network

  # =========================================

  oauth2-proxy:

    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0

    container_name: ai-interview-oauth2-proxy

    restart: unless-stopped

    env_file:
      - .env

    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}

    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg

    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro

    depends_on:
      - frontend
      - backend

    networks:
      - app-network

# =========================================

volumes:
  postgres_data:

# =========================================

networks:
  app-network:
    driver: bridge
